name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
      - run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml config -q
        env: { DOMAIN: ci.example.com, GIT_AUTHOR_NAME: ci, GIT_AUTHOR_EMAIL: ci@example.com }

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:github
        env: { TEST_VAULT_TOKEN: '${{ secrets.TEST_VAULT_TOKEN }}' }
      # Real model turns on a local Ollama (no provider key): pull the model into a volume once.
      - run: |
          docker volume create ollama-models
          docker run -d --name pull -v ollama-models:/root/.ollama ollama/ollama
          sleep 3 && docker exec pull ollama pull qwen2.5:3b && docker rm -f pull
      - run: npm run test:llm
        env: { OLLAMA_VOLUME: ollama-models }
