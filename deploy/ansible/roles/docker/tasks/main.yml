# Docker CE + compose plugin from Docker's apt repo (Ubuntu's docker.io lags behind).
- name: Docker apt repo
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Docker packages
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Drop-in directory for docker.service
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

# Published ports bind to the tailnet IP, which exists only once tailscaled is up.
- name: Start Docker after tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/after-tailscale.conf
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
    mode: "0644"
  when: tailscale_enabled
  notify: Restart docker

# Ports are published on the tailnet IP. At boot Docker may start the containers before tailscale0
# has that IP, and the bind fails ("cannot assign requested address"); `unless-stopped` doesn't retry.
# Allowing a bind to an address that isn't there yet makes the order irrelevant.
- name: Allow binding the tailnet IP before it exists
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/90-karpathy.conf
    reload: true
  when: tailscale_enabled

- name: Docker running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Login user in the docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: [docker]
    append: true
