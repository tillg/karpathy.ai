# karpathy.app stack (mvp §2.5). Only the proxy publishes ports; opencode is internal-only.
name: karpathy-app

x-app-user: &app-user "${APP_UID:-1000}:${APP_GID:-1000}"
# Bounded container logs (json-file, 3 × 10 MB per container).
x-logging: &logs { driver: json-file, options: { max-size: 10m, max-file: "3" } }
# Images: a release runs the GHCR images of its version (APP_VERSION, no v); prodtest builds them as :dev.

services:
  proxy:
    image: ghcr.io/tillg/karpathy.app-proxy:${APP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/proxy/Dockerfile }
    restart: unless-stopped
    # No port 80: certificates come via DNS-01. BIND_IP is the tailnet IP on a server.
    ports: ["${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *logs
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_MODE: ${TLS_MODE:-dns}
      DNS_PROVIDER: ${DNS_PROVIDER:-cloudflare}
      DNS_API_TOKEN_FILE: /run/secrets/dns_api_token
    secrets: [dns_api_token]
    volumes: [caddy-data:/data]
    # Caddy's own plain-HTTP health site inside the container (Caddyfile); independent of the backend.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      backend: { condition: service_healthy }
    networks: [edge, internal]

  backend:
    image: ghcr.io/tillg/karpathy.app-backend:${APP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/backend/Dockerfile }
    restart: unless-stopped
    # PID 1 is `npm exec`, which doesn't reap orphans: without an init every git child stayed a zombie.
    init: true
    user: *app-user
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
    environment:
      BEARER_TOKEN_FILE: /run/secrets/bearer_token
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-karpathy.app user}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-user@karpathy.app}
      OPENCODE_URL: http://opencode:4096
      DEFAULT_MODEL: ${DEFAULT_MODEL:-anthropic/claude-sonnet-5}
      OPENCODE_VAULTS_DIR: /vaults
      # Commit and log timestamps in the target's timezone (role app writes TZ to .env).
      TZ: ${TZ:-Etc/UTC}
    secrets: [bearer_token, github_token]
    volumes:
      - vaults:/vaults
      - config:/config
    depends_on:
      opencode: { condition: service_healthy }
    networks: [internal]

  opencode:
    image: ghcr.io/tillg/karpathy.app-opencode:${APP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/opencode/Dockerfile }
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
    # opencode as PID 1 ignores SIGTERM (every stop was a SIGKILL after 10 s, #38).
    init: true
    user: *app-user
    env_file: [{ path: ./opencode.env, required: false }]
    environment:
      OPENCODE_MODEL: ${DEFAULT_MODEL:-anthropic/claude-sonnet-5}
    tmpfs: ["/home/app:uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700"]
    volumes:
      - vaults:/vaults
      - opencode-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4096/global/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

networks:
  edge: {}
  # No egress restriction: opencode must reach the LLM provider APIs.
  internal: {}

volumes:
  vaults: {}
  config: {}
  opencode-data: {}
  caddy-data: {}

secrets:
  bearer_token: { file: ./secrets/bearer_token }
  github_token: { file: ./secrets/github_token }
  dns_api_token: { file: ./secrets/dns_api_token }
