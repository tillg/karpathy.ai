# Forward proxy for the AI's container. Public destinations only: loopback, private, link-local
# (cloud metadata), CGNAT/tailnet, ULA, multicast and reserved addresses are refused, whatever name
# they are reached by. (Ranges, not 0.0.0.0/8 or ::/128: Squid reads those masks as "match everything".)
http_port 3128
acl SSL_ports port 443
acl Safe_ports port 80 443 1025-65535
acl CONNECT method CONNECT
acl internal_dst dst 0.0.0.0-0.255.255.255 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0-255.255.255.255
acl internal_dst dst ::1/128 :: fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96 2002::/16
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny internal_dst
http_access allow all

# No cache, no client identity, no disk state.
cache deny all
forwarded_for delete
pid_filename none
access_log stdio:/dev/stdout
cache_log /dev/stderr
coredump_dir /tmp
