<!DOCTYPE html>
<!--
  06 · Home Dashboard + Omnibox — karpathy.ai UI prototype

  Rationale: a launcher. Most sessions start with "find X" or "ask about X", so the home screen
  is one omnibox (Files / Full-text / Ask AI in a single result list) plus cards that surface
  what needs attention: recent notes, the raw/ inbox (one-tap Ingest), recent AI edits with diffs,
  wiki health (lint findings) and git status. Opening a note pushes a full view with breadcrumbs
  (Home › wiki › concepts › llm-wiki) and a persistent mini chat bar ("Ask about this page…")
  that expands into the chat panel. Routing is hash-based, so browser back / swipe-back works.

  Navigation per form factor:
  - Phone (<700px): stacked cards, omnibox floats at the bottom (thumb zone); results open as a
    full-height sheet above it. Note view: back button + condensed breadcrumb; file tree is a
    left drawer (breadcrumb folder or tree button); mini chat bar expands to a full-screen sheet.
  - iPad portrait (700-1179px): 2-column dashboard, omnibox in the hero. Note full-width, tree as
    drawer, chat expands as a bottom sheet from the mini bar.
  - iPad landscape / desktop (>=1180px): 12-col dashboard grid; note view = tree sidebar | note |
    chat split (chat column toggled by the mini bar). Cmd/Ctrl+K opens the omnibox palette anywhere.
-->

  color-scheme:light;
}

  --bg:#0a111d;--surface:#111b2b;--surface-2:#172437;--surface-3:#1f2e45;--border:#23324a;
  --text:#e6ecf5;--muted:#9eabc0;--faint:#6f7e96;--primary:#e6ecf5;--primary-ink:#0f1e33;
  --accent:#ff7a52;--accent-soft:#3a2119;--accent-ink:#ff9a78;
  --ok:#3ecf8e;--ok-soft:#12302a;--warn:#f0b54a;--warn-soft:#33280f;--bad:#ff6b6b;--bad-soft:#3a1a1d;

:root[data-theme="dark"]{
  --bg:#0a111d;--surface:#111b2b;--surface-2:#172437;--surface-3:#1f2e45;--border:#23324a;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono)}
/* strip + topbar */
.strip{position:fixed;top:0;left:0;right:0;z-index:28;padding:var(--st) calc(12px + var(--sr)) 0 calc(12px + var(--sl));height:calc(var(--strip) + var(--st));display:flex;align-items:center;gap:10px;background:#0f1e33;color:#fff;font-size:12px}
.strip a{font-weight:600;opacity:.9}.strip a:hover{opacity:1;text-decoration:underline}
.strip span{opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar{position:fixed;left:0;right:0;top:calc(var(--st) + var(--strip));height:var(--bar);z-index:30;display:flex;align-items:center;gap:6px;padding:0 calc(12px + var(--sr)) 0 calc(12px + var(--sl));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 0;flex:none}
.brand img{width:32px;height:32px;border-radius:9px;background:#fff;object-fit:cover;box-shadow:0 0 0 1px var(--border)}
.wordmark{font-family:Silkscreen,monospace;font-size:17px;letter-spacing:.5px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.back{display:none}
.crumbs{display:none;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden;white-space:nowrap;font-size:14px;color:var(--muted)}

.crumbs .sep{color:var(--faint)}.crumbs .cur{color:var(--text);font-weight:600;padding:6px 4px;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
body.v-home #searchBtn{display:none}body.v-note .crumbs{display:flex}body.v-note .spacer{display:none}body.v-note .back{display:grid}
.git-pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.git-pill:hover{color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.dot.dirty{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}.dot.busy{background:var(--accent);animation:pulse 1s infinite}

.kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--border);color:var(--faint);background:var(--surface)}
/* app grid */
.app{position:absolute;top:var(--top);left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
main{grid-column:1/-1;min-width:0;min-height:0;position:relative}
body.split .app{grid-template-columns:264px minmax(0,1fr)}
body.split.chat-open .app{grid-template-columns:264px minmax(0,1fr) 420px}
body.split main{grid-column:2}
.view{position:absolute;inset:0;display:none}
body.v-home #home{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch}
body.v-note #note{display:flex;flex-direction:column}
/* home */
.home-inner{max-width:1320px;margin:0 auto;padding:28px calc(24px + var(--sr)) 48px calc(24px + var(--sl))}

.omni{display:flex;align-items:center;gap:10px;height:60px;padding:0 10px 0 18px;border-radius:20px;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--shadow)}

.skills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}

.rs-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:10px 12px 4px}
.ri{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:46px;padding:8px 12px;border-radius:12px}

.ri .ic{color:var(--faint)}.ri .t{font-weight:500}.ri .p{font-size:12px;color:var(--faint);font-family:var(--mono)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:flex;flex-direction:column}

.c-edits{grid-column:span 6}.c-health{grid-column:span 3}.c-vault{grid-column:span 3}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:48px;padding:8px 10px;margin:0 -10px;border-radius:12px;width:calc(100% + 20px)}

.row .col{flex:1;min-width:0}.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.entity{background:#17284a;color:#9dbbff}:root:not([data-theme="light"]) .tag.synthesis{background:#2a1d44;color:#c9a8ff}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:11px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);white-space:nowrap}

.health-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}

.sev{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warn)}.sev.bad{background:var(--bad)}.sev.info{background:var(--faint)}
.git-stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.btns{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
/* tree */
.tree{font-size:14px}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px}.tree>ul{padding:0}
.tn{display:flex;align-items:center;gap:7px;width:100%;min-height:34px;padding:4px 8px;border-radius:9px;text-align:left;color:var(--muted);white-space:nowrap;overflow:hidden}

.tn .ic{width:16px;height:16px}.tn .chev{transition:transform .15s}.tn.open .chev{transform:rotate(90deg)}

.c-vault .tree{max-height:330px;overflow:auto;margin:0 -8px}
.tree-pane{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:50;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .25s ease;padding-top:var(--st);padding-left:var(--sl)}

.pane-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 16px;font-weight:600;font-size:14px}
.pane-h .spacer{display:block}
.tree-pane .tree{flex:1;overflow:auto;padding:0 8px 16px}
body.split .tree-pane{position:static;grid-column:1;grid-row:1;transform:none;width:auto;z-index:1;padding-top:0;background:var(--bg)}

.notebar{display:flex;align-items:center;gap:8px;padding:10px calc(20px + var(--sr)) 10px calc(20px + var(--sl));border-bottom:1px solid var(--border);background:var(--surface);flex:none}

.notebar .path{font-family:var(--mono);font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-left:auto;flex:none}

.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.save{font-size:12px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:6px}
.doc-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.doc{max-width:760px;margin:0 auto;padding:28px calc(28px + var(--sr)) 40px calc(28px + var(--sl))}
.cm{font-family:var(--mono);font-size:14px;line-height:1.75;outline:none;caret-color:var(--accent)}

# LLM Wiki

Ein **LLM Wiki** ist eine persistente Wissensbasis, die ein LLM aus Rohquellen pflegt — statt bei jeder Frage neu zu retrieven (vgl. [[rag]]). Begriff und Idee stammen von [[andrej-karpathy]].

## Kernidee
- Rohquellen landen unveränderlich in \`raw/\`
- Das LLM schreibt und pflegt Seiten in \`wiki/\` (entities, concepts, sources, synthesis)
- Der Mensch liest, das LLM schreibt — *compile once, query often*

## Workflow
1. **Ingest** — Quelle lesen, Summary unter [[sources/karpathy-llm-wiki-gist]] anlegen
2. **Query** — Fragen gegen den [[index]] beantworten, gute Antworten als Synthesis ablegen
3. **Lint** — tote Links, Waisen und Widersprüche finden

## Abgrenzung
> RAG re-derives knowledge on every query; an LLM wiki accumulates it.

Siehe auch [[synthesis/rag-vs-llm-wiki]], [[obsidian]] als Frontend und [[context-engineering]].

## Offene Fragen
- Wie skaliert der [[index]] über ~500 Seiten?
- Konflikte bei gleichzeitigen Edits aus Obsidian mobile — siehe [[timeline-of-llm-tools]]`;

V['raw/articles/karpathy-llm-wiki-gist.md']=`# LLM Wiki — Andrej Karpathy (gist)

> Clipped with Obsidian Web Clipper · 2026-09-23

A pattern for building personal knowledge bases using LLMs. Instead of retrieving from raw documents at query time, the LLM incrementally builds and maintains a persistent wiki — a structured, interlinked collection of markdown files.

The wiki is a persistent, compounding artifact. You never (or rarely) write the wiki yourself — the LLM writes and maintains all of it.`;

function inl(s,live){s=esc(s);

function route(){const h=location.hash.slice(1)||'/home',chat=h.endsWith('?chat'),b=h.replace(/\?chat$/,'');const B=document.body;
  closeOmni();
  if(b.startsWith('/note/')){const p=decodeURIComponent(b.slice(6));const was=B.classList.contains('v-note');if(p!==S.path||!was){S.path=p;S.ctx=p}B.classList.remove('v-home');B.classList.add('v-note');const s=p.split('/');s.slice(0,-1).forEach((_,i)=>S.open.add(s.slice(0,i+1).join('/')));renderCrumbs();if(p!==S.rendered||!was||S.stale)renderNote()}
  else{B.classList.add('v-home');B.classList.remove('v-note');S.ctx=null;renderHome()}
  S.chat=chat;B.classList.toggle('chat-open',chat);layout();renderTrees();renderCtx();
  $('#chatTitle').textContent=B.classList.contains('v-note')?'Chat · '+title(S.path):'Chat · Vault'}
function layout(){document.body.classList.toggle('split',document.body.classList.contains('v-note')&&isSplitW())}
function openChat(focus=true){S.chatPushed=!S.chat;if(!S.chat)go(base()+'?chat');if(focus&&!matchMedia('(max-width:699px)').matches)setTimeout(()=>$('#chatIn').focus(),300);scrollMsgs()}
function closeChat(){if(S.chatPushed&&history.length>1){S.chatPushed=false;history.back()}else go(base())}

/* ---------- chat ---------- */
const SKILLS=['/ingest','/query','/lint','/timeline'];
function renderCtx(){$('#ctxRow').innerHTML=S.ctx?`<span class="ctxchip">${ic('file')}${S.ctx.split('/').pop()}<button id="rmCtx" aria-label="Remove context">${ic('close')}</button></span>`:'';$('#ctxRow').style.display=S.ctx?'flex':'none'}
function scrollMsgs(){const m=$('#msgs');m.scrollTop=m.scrollHeight}
function addMsg(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;$('#msgs').appendChild(d);scrollMsgs();return d}
const WHO=()=>`<div class="who"><img src="../../../assets/karpathy_ai_logo.png" alt="">${MODELS[S.model][0]} · ${MODELS[S.model][1]}</div>`;
function chipHTML(t,cls){return `<span class="tc ${cls}"${cls==='ed'?` data-open="${t.path}"`:''}>${ic(cls==='run'?'spin':cls==='ed'?'edit':'check')}${esc(t.label)}</span>`}
function seedChat(){addMsg('u','<code>/ingest raw/articles/karpathy-llm-wiki-gist.md</code>');
  const e=S.edits[0];addMsg('a',WHO()+`<div class="tools">${chipHTML({label:'read raw/articles/karpathy-llm-wiki-gist.md'},'done')}${chipHTML({label:'read wiki/index.md'},'done')}${chipHTML({label:"grep 'Karpathy'"},'done')}${chipHTML({label:'edited wiki/concepts/llm-wiki.md +12 −3',path:e.path},'ed')}${chipHTML({label:'edited wiki/index.md +1',path:'index.md'},'ed')}</div><p>Ingested. Created ${inl('[[sources/karpathy-llm-wiki-gist]]')}, extended ${inl('[[llm-wiki]]')} with <em>Abgrenzung</em> and a sharper lint step, and added the index entry.</p>${diffHTML(e.diff)}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" data-open="${e.path}">${ic('file')}Open changed page</button><button class="btn sm" data-open="wiki/sources/karpathy-llm-wiki-gist.md">Open source summary</button></div>`)}
function plan(text){const t=text.trim(),ctx=S.ctx||'wiki/concepts/llm-wiki.md';
  if(t.startsWith('/lint'))return{tools:['read wiki/index.md',"glob 'wiki/**/*.md'","grep '\\[\\['"],text:`Checked 17 wiki pages. **1 dead link**: [[timeline-of-llm-tools]] in [[llm-wiki]]. **1 orphan**: [[synthesis/obsidian-vs-notion-for-agents]] has no inbound links. **1 contradiction**: [[rag-vs-llm-wiki]] vs. [[rag]] on cost. ${S.inbox.length} raw sources are not ingested yet. Want me to fix the dead link?`};
  if(t.startsWith('/ingest')){const src=(t.split(/\s+/)[1])||S.inbox[0]||'raw/articles/vibe-coding-thread.md';const name=src.split('/').pop();
    return{tools:['read '+src,'read wiki/index.md',"grep 'Karpathy'"],text:`Ingested **${title(src)}**. New summary [[sources/${name.replace('.md','')}]]; it strengthens [[vibe-coding]] and adds a dated claim to [[llm-wiki]].`,edit:{path:'wiki/concepts/llm-wiki.md',lines:['## Neu aus '+title(src),'- '+title(src)+' bestätigt: Agenten editieren lieber rohes Markdown als Blöcke','- Siehe [[vibe-coding]] und [[sources/'+name.replace('.md','')+']]'],del:0},newFile:'wiki/sources/'+name,src};}
  if(t.startsWith('/timeline'))return{tools:["grep 'updated: 2026'",'read log.md'],text:`Built a timeline of 9 dated events (Feb 2025 → Sep 2026) and saved it as [[synthesis/llm-tools-timeline]].`,newFile:'wiki/synthesis/llm-tools-timeline.md'};
  const kw=(t.replace(/^\/query\s*/,'').match(/[A-Za-zÄÖÜäöü]{5,}/)||['Karpathy'])[0];
  if(/\b(add|update|fix|ergänz|füg|improve|edit)/i.test(t))return{tools:['read '+ctx,"grep '"+kw+"'",'read wiki/synthesis/rag-vs-llm-wiki.md'],text:`Done — I added a short *Praxis* section to [[${ctx.replace(/\.md$/,'').split('/').pop()}]] with two cross-links.`,edit:{path:ctx,lines:['## Praxis','- Dieses Vault ist selbst ein [[llm-wiki]]: Obsidian liest, der Agent schreibt','- Vergleich zu klassischem Retrieval: [[synthesis/rag-vs-llm-wiki]]'],del:1}};
  return{tools:['read wiki/index.md',"grep '"+kw+"'",'read '+ctx],text:`From the wiki: an [[llm-wiki]] *compiles* knowledge once into interlinked pages, while [[rag]] re-derives it per query. [[andrej-karpathy]] frames the human as reader and the LLM as maintainer. Sources: [[sources/karpathy-llm-wiki-gist]], [[synthesis/rag-vs-llm-wiki]]. Should I file this answer as a synthesis page?`}}
function send(text){text=(text||'').trim();if(!text||S.streaming)return;S.streaming=true;
  $('#chatIn').value='';addMsg('u',esc(text).replace(/^(\/\w+)/,'<code>$1</code>'));
  const P=plan(text),m=addMsg('a',WHO()+'<div class="tools"></div><div class="body"><div class="typing"><i></i><i></i><i></i></div></div><div class="after"></div>');
  if(P.newFile)V[P.newFile]=`---\ntype: ${typeOf(P.newFile)}\ntags: [llm, ai-generated]\nupdated: 2026-09-25\nsources: [${(P.src||'log.md').split('/').pop()}]\nconfidence: medium\n---\n# ${slugT(P.newFile)}\n\nAI-generated on 2026-09-25. Links: [[llm-wiki]], [[andrej-karpathy]].\n\n## Key points\n- Agents prefer raw Markdown + git over block stores\n- See [[index]] for context`;
  const tools=m.querySelector('.tools'),body=m.querySelector('.body'),after=m.querySelector('.after');let t=400;
  P.tools.forEach(label=>{setTimeout(()=>{tools.insertAdjacentHTML('beforeend',chipHTML({label},'run'));scrollMsgs()},t);t+=550;setTimeout(()=>{const c=tools.lastElementChild;c.className='tc done';c.innerHTML=ic('check')+esc(label)},t);t+=150});
  setTimeout(()=>{const words=P.text.split(' ');let i=0;body.innerHTML='<p class="caret"></p>';const p=body.firstChild;
    const iv=setInterval(()=>{i+=2;p.innerHTML=inl(words.slice(0,i).join(' '));scrollMsgs();if(i>=words.length){clearInterval(iv);p.classList.remove('caret');finish()}},45)},t);
  function finish(){const acts=[];
    S.stale=true;if(P.newFile){
      tools.insertAdjacentHTML('beforeend',chipHTML({label:'created '+P.newFile+' +9',path:P.newFile},'ed'));S.dirty++;acts.push(P.newFile)}
    if(P.edit){const e=P.edit;V[e.path]=V[e.path]+'\n\n'+e.lines.join('\n');S.changed[e.path]=e.lines;
      const lab=`edited ${e.path} +${e.lines.length+1} −${e.del}`;tools.insertAdjacentHTML('beforeend',chipHTML({label:lab,path:e.path},'ed'));
      const d=[['c','@@ end of file @@'],...(e.del?[['d','- Offene Punkte beim nächsten **/lint** prüfen']]:[]),...e.lines.map(l=>['a',l])];after.innerHTML=diffHTML(d);
      S.edits.unshift({path:e.path,when:'just now',skill:text.split(' ')[0].startsWith('/')?text.split(' ')[0]:'chat',add:e.lines.length+1,del:e.del,diff:d});S.dirty++;acts.unshift(e.path)}
    if(P.src){S.inbox=S.inbox.filter(x=>x!==P.src)}
    if(acts.length)after.insertAdjacentHTML('beforeend',`<div style="display:flex;gap:8px;flex-wrap:wrap">${acts.map((a,i)=>`<button class="btn sm ${i?'':'pri'}" data-open="${a}">${ic('file')}${i?'Open '+a.split('/').pop():'Open changed page'}</button>`).join('')}<button class="btn sm" data-git="commit">${ic('check')}Commit</button></div>`);
    renderGit();renderTrees();if(document.body.classList.contains('v-home'))renderHome();else if(P.edit&&P.edit.path===S.path)renderNote();
    scrollMsgs();S.streaming=false;if(!S.chat)toast('AI finished · '+(acts.length?acts[0].split('/').pop()+' changed':'answer ready'))}}

/* ---------- misc ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}
function renderModels(){$('#modelMenu').innerHTML=MODELS.map((m,i)=>`<button data-model="${i}" class="${i===S.model?'on':''}"><span>${m[0]}<small>${m[1]}</small></span><span class="ck">${ic('check')}</span></button>`).join('')+`<button data-toast="Provider settings live server-side (opencode config)"><span style="color:var(--faint)">Manage providers…</span></button>`;$('#modelLbl').textContent=MODELS[S.model][0];$('#modelProv').textContent='· '+MODELS[S.model][1].split(' ')[0]}
function skillChips(){return SKILLS.map(s=>`<button class="chip" data-skill="${s}"><b>${s}</b></button>`).join('')}
function runSkill(s){closeOmni();openChat(false);if(s==='/query'){$('#chatIn').value='/query ';setTimeout(()=>$('#chatIn').focus(),300)}else setTimeout(()=>send(s==='/ingest'?'/ingest '+(S.inbox[0]||''):s),250)}
function setTheme(t){document.documentElement.dataset.theme=t;$('#themeBtn').innerHTML=ic(t==='dark'?'sun':'moon');try{localStorage.setItem('kai-theme',t)}catch(e){}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-path],[data-link],[data-dir],[data-folder],[data-home],[data-tree],[data-chat],[data-skill],[data-ingest],[data-ask],[data-git],[data-model],[data-toast],[data-inbox]');
  if(!e.target.closest('.model'))$('#modelMenu').classList.remove('open');
  if(!e.target.closest('#gitMenu,#gitPill'))$('#gitMenu').classList.remove('open');
  if(!t){if(!e.target.closest('.omni-wrap,.skills,.palette'))document.body.classList.remove('omni-open');return}
  const d=t.dataset;
  if(d.open)openFile(d.open);
  else if(d.path){e.preventDefault();openFile(d.path)}
  else if(d.link)toast(`“${d.link}” doesn't exist yet — ask the AI to create it`);
  else if(d.dir){S.open.has(d.dir)?S.open.delete(d.dir):S.open.add(d.dir);renderTrees()}
  else if(d.folder!==undefined)revealFolder(d.folder);
  else if(d.home!==undefined)go('/home');
  else if(d.tree!==undefined){if(document.body.classList.contains('v-home')){$('.c-vault').scrollIntoView({behavior:'smooth',block:'center'})}else document.body.classList.add('tree-open')}
  else if(d.chat!==undefined)openChat();
  else if(d.skill)runSkill(d.skill);
  else if(d.ingest){openChat(false);setTimeout(()=>send('/ingest '+d.ingest),250)}
  else if(d.ask){const q=$('#omniInput').value||$('#palInput').value;$('#omniInput').value='';closeOmni();document.activeElement.blur();openChat(false);setTimeout(()=>send(q),250)}
  else if(d.git)git(d.git);
  else if(d.model){S.model=+d.model;renderModels();$('#modelMenu').classList.remove('open');toast('Model → '+MODELS[S.model].join(' · '))}
  else if(d.toast)toast(d.toast);
  else if(d.inbox!==undefined)$('.c-inbox').scrollIntoView({behavior:'smooth',block:'center'})});
$('#omniInput').addEventListener('focus',openOmni);
omniKeys($('#omniInput'),$('#omniRes'));omniKeys($('#palInput'),$('#palRes'));
$('#searchBtn').onclick=openPalette;
$('#backBtn').onclick=()=>history.length>1?history.back():go('/home');
$('#scrim').onclick=()=>{const B=document.body;if(B.classList.contains('tree-open'))B.classList.remove('tree-open');else if(B.classList.contains('pal-open')||B.classList.contains('omni-open'))closeOmni();else if(S.chat)closeChat()};
$('#closeTree').onclick=()=>document.body.classList.remove('tree-open');
$('#miniBar').onclick=()=>openChat();
$('#closeChat').onclick=closeChat;
$('#newChat').onclick=()=>{$('#msgs').innerHTML='';toast('New session started')};
$('#modelBtn').onclick=e=>{e.stopPropagation();$('#modelMenu').classList.toggle('open')};
$('#gitPill').onclick=()=>$('#gitMenu').classList.toggle('open');
$('#themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark')};
$('#mLive').onclick=()=>{S.mode='live';renderNote()};$('#mPrev').onclick=()=>{S.mode='preview';renderNote()};
$('#sendBtn').onclick=()=>send($('#chatIn').value);
$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e.target.value)}});
$('#chatIn').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'});
$('#ctxRow').addEventListener('click',e=>{if(e.target.closest('#rmCtx')){S.ctx=null;renderCtx()}});
$('#ingestAll').onclick=()=>{if(!S.inbox.length)return toast('Inbox is empty');openChat(false);setTimeout(()=>send('/ingest '+S.inbox[0]),250)};
$('#expandAll').onclick=()=>{Object.keys(V).forEach(p=>{const s=p.split('/');s.slice(0,-1).forEach((_,i)=>S.open.add(s.slice(0,i+1).join('/')))});renderTrees()};
$('#newNote').onclick=()=>toast('New note in wiki/ (demo)');
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}else if(e.key==='Escape'){if(document.body.classList.contains('tree-open'))document.body.classList.remove('tree-open');else if(document.body.classList.contains('pal-open')||document.body.classList.contains('omni-open'))closeOmni();else if(S.chat)closeChat()}});
addEventListener('hashchange',route);addEventListener('resize',layout);

hydrate();
try{const t=localStorage.getItem('kai-theme');if(t)setTheme(t);else $('#themeBtn').innerHTML=ic(matchMedia('(prefers-color-scheme: dark)').matches?'sun':'moon')}catch(e){}
$('#skillsHome').innerHTML=skillChips();$('#skillsChat').innerHTML=skillChips();
renderModels();seedChat();renderGit();route();
</script>
</body>
</html>
